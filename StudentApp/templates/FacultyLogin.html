{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal - Faculty Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* ===== CAMPUS COLOR SYSTEM ===== */

:root{
--primary-blue:#1E4E8C;
--secondary-blue:#3B6EA5;
--accent-red:#E64A5B;
--text-light:#ffffff;
--text-dark:#2F2F2F;
--text-muted:#6c757d;
--bg-light:#F3F6FA;
--border-radius-pill:30px;
--border-radius-xl:20px;
--font-family:'Poppins',sans-serif;
}

/* ===== GLOBAL RESET ===== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:var(--font-family);
background:var(--bg-light);
color:var(--text-dark);
display:flex;
flex-direction:column;
min-height:100vh;
}

a{text-decoration:none;color:inherit;transition:.3s}
ul{list-style:none}
h1,h2,h3{font-weight:700}

/* ===== HEADER ===== */

.main-header{
background:linear-gradient(135deg,#1E4E8C,#3B6EA5);
color:white;
padding:.8rem 5%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 14px rgba(0,0,0,.15);
}

.logo-container{
display:flex;
align-items:center;
font-size:1.5rem;
font-weight:700;
}

.logo-icon{
font-size:2.2rem;
margin-right:12px;
}

.nav-menu{
display:flex;
gap:15px;
flex-wrap:wrap;
}

.nav-link{
padding:.5rem 1.2rem;
border-radius:var(--border-radius-pill);
font-weight:500;
font-size:.95rem;
border:2px solid transparent;
}

.nav-link.active{
background-color:var(--accent-red);
color:var(--text-light);
border-color:var(--accent-red);
}

.nav-link:not(.active){
color:white;
border-color:white;
}

.nav-link:not(.active):hover{
background:var(--accent-red);
border-color:var(--accent-red);
}

/* ===== MAIN LOGIN AREA ===== */

.main-content{
flex:1;
display:flex;
align-items:center;
justify-content:center;
padding:40px 5%;
}

/* LOGIN BOX */

.login-wrapper{
display:flex;
background:white;
border-radius:var(--border-radius-xl);
box-shadow:0 20px 50px rgba(0,0,0,0.15);
overflow:hidden;
max-width:820px;
width:100%;
}

/* ===== IMAGE SIDE ===== */

.login-image-side{
flex:1;
position:relative;
overflow:hidden;
}

.login-image-side img{
width:100%;
height:100%;
object-fit:cover;
}

/* ===== FORM SIDE ===== */

.login-form-side{
flex:1;
padding:45px 40px;
display:flex;
flex-direction:column;
justify-content:center;
}

/* TITLE */

.form-title{
font-size:2rem;
color:var(--primary-blue);
margin-bottom:10px;
position:relative;
}

.form-title::after{
content:"";
display:block;
width:55px;
height:3px;
background:var(--accent-red);
margin-top:6px;
border-radius:3px;
}

.form-subtitle{
color:var(--text-muted);
margin-bottom:22px;
font-size:1rem;
}

/* ALERT */

.alert-message{
background:#fee2e2;
color:#b91c1c;
padding:12px 14px;
border-radius:8px;
margin-bottom:18px;
font-size:.95rem;
text-align:center;
border:1px solid #f87171;
}

/* INPUTS */

.input-group{
margin-bottom:18px;
}

.input-field-wrapper{
position:relative;
display:flex;
align-items:center;
border:2px solid #e5e7eb;
border-radius:12px;
padding:12px 16px;
transition:.3s;
}

.input-field-wrapper:focus-within{
border-color:var(--secondary-blue);
box-shadow:0 0 0 4px rgba(59,110,165,.15);
}

.input-icon{
color:var(--primary-blue);
font-size:1.1rem;
margin-right:12px;
}

.form-input{
flex:1;
border:none;
outline:none;
background:transparent;
font-size:1rem;
}


.login-btn{
width:100%;
padding:12px;
background:var(--primary-blue);
color:white;
border:none;
border-radius:12px;
font-size:1.05rem;
font-weight:600;
cursor:pointer;
margin-top:10px;
transition:all .25s ease;
}

.login-btn:hover{
background:var(--accent-red);
box-shadow:0 6px 18px rgba(230,74,91,0.35);
transform:translateY(-2px);
}

.login-btn:active{
transform:scale(.98);
}

/* ===== FOOTER ===== */

.main-footer{
background:var(--primary-blue);
color:white;
padding:1rem 5%;
display:flex;
justify-content:space-between;
align-items:center;
}

.footer-links{
display:flex;
gap:25px;
}

.footer-link{
font-size:.9rem;
opacity:.8;
}

.footer-link:hover{
opacity:1;
text-decoration:underline;
}

.social-icons{
display:flex;
gap:20px;
}

.social-icon{
font-size:1.2rem;
opacity:.8;
}

.social-icon:hover{
opacity:1;
transform:translateY(-3px);
}

/* ===== RESPONSIVE ===== */

@media(max-width:850px){

.login-wrapper{
flex-direction:column;
max-width:520px;
}

.login-image-side{
display:none;
}

.login-form-side{
padding:35px 28px;
}

}

@media(max-width:768px){

.main-header{
flex-direction:column;
gap:15px;
}

.nav-menu{
justify-content:center;
}

.main-footer{
flex-direction:column;
gap:15px;
text-align:center;
}

}

</style>


</head>

<body>

<header class="main-header">

<div class="logo-container">
<i class="fas fa-graduation-cap logo-icon"></i>
<span>Student Portal</span>
</div>

<nav class="nav-menu">
<a href="{% url 'index' %}" class="nav-link">Home</a>
<a href="{% url 'StudentLogin' %}" class="nav-link">Student Login</a>
<a href="{% url 'FacultyLogin' %}" class="nav-link active">Faculty Login</a>
<a href="{% url 'AdminLogin' %}" class="nav-link">Admin Login</a>
</nav>

</header>

<main class="main-content">

<div class="login-wrapper">

<div class="login-image-side">
<img src="{% static 'images/22.png' %}">
</div>

<div class="login-form-side">

<h2 class="form-title">Faculty Access</h2>
<p class="form-subtitle">Please enter faculty credentials to manage your dashboard.</p>

{% if data %}

<div class="alert-message">
<i class="fas fa-exclamation-circle"></i> {{ data }}
</div>
{% endif %}

<form name="f1" method="post" action="{% url 'FacultyLoginAction' %}">
{% csrf_token %}

<div class="input-group">
<div class="input-field-wrapper">
<i class="fas fa-chalkboard-teacher input-icon"></i>
<input type="text" name="t1" class="form-input" placeholder="Faculty Username" required>
</div>
</div>

<div class="input-group">
<div class="input-field-wrapper">
<i class="fas fa-lock input-icon"></i>
<input type="password" name="t2" class="form-input" placeholder="Password" required>
</div>
</div>

<button type="submit" class="login-btn">Secure Login</button>

</form>

</div>

</div>

</main>

<footer class="main-footer">

<div class="footer-links">
<a href="#" class="footer-link">Contact Us</a>
<a href="#" class="footer-link">Privacy Policy</a>
<a href="#" class="footer-link">Terms of Service</a>
</div>

<div class="social-icons">
<a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
<a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
<a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
<a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
</div>

</footer>

</body>
</html>
