{% load static %}

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal - Faculty Suggestions</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

/* ===== GLOBAL THEME ===== */

:root{
--primary-blue:#1E4E8C;
--secondary-blue:#3B6EA5;
--accent-red:#E64A5B;
--text-light:#ffffff;
--text-dark:#2F2F2F;
--text-muted:#6c757d;
--bg-light:#F3F6FA;
--border-radius-pill:30px;
--border-radius-xl:20px;
--font-family:'Poppins',sans-serif;
}

/* ===== RESET ===== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:var(--font-family);
background:var(--bg-light);
color:var(--text-dark);
display:flex;
flex-direction:column;
min-height:100vh;
}

a{text-decoration:none;color:inherit;transition:.3s}
ul{list-style:none}

/* ===== HEADER ===== */

.main-header{
background:linear-gradient(135deg,#1E4E8C,#3B6EA5);
color:white;
padding:.8rem 5%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 14px rgba(0,0,0,.15);
}

.logo-container{
display:flex;
align-items:center;
font-size:1.5rem;
font-weight:700;
}

.logo-icon{
font-size:2rem;
margin-right:12px;
}

/* ===== NAVIGATION ===== */

.nav-menu{
display:flex;
gap:12px;
flex-wrap:wrap;
}

.nav-link{
padding:.5rem 1.1rem;
border-radius:var(--border-radius-pill);
font-weight:500;
font-size:.9rem;
border:2px solid transparent;
white-space:nowrap;
}

.nav-link.active{
background:var(--accent-red);
color:white;
border-color:var(--accent-red);
}

.nav-link:not(.active){
color:white;
border-color:white;
}

.nav-link:not(.active):hover{
background:var(--accent-red);
border-color:var(--accent-red);
}

/* ===== MAIN CONTENT ===== */

.main-content{
flex:1;
padding:40px 5%;
display:flex;
justify-content:center;
}

/* ===== CARD ===== */

.dashboard-container{
width:100%;
max-width:1000px;
background:white;
border-radius:var(--border-radius-xl);
box-shadow:0 15px 40px rgba(0,0,0,0.12);
padding:40px;
text-align:center;
}

/* TITLE */

.dashboard-title{
color:var(--primary-blue);
font-size:2rem;
margin-bottom:5px;
}

.dashboard-subtitle{
color:var(--text-muted);
margin-bottom:30px;
font-size:.95rem;
}

/* ===== TABLE ===== */

.table-responsive{
overflow-x:auto;
width:100%;
}

.dashboard-container table{
width:100%;
border-collapse:collapse !important;
border:hidden !important;
text-align:left;
}

.dashboard-container th{
background:var(--primary-blue) !important;
color:white !important;
padding:14px 18px;
font-weight:600;
border:none !important;
}

.dashboard-container th font{
color:white !important;
font-size:1rem !important;
}

.dashboard-container td{
padding:14px 18px;
border-bottom:1px solid #e5e7eb !important;
border-left:none !important;
border-right:none !important;
border-top:none !important;
color:var(--text-dark) !important;
vertical-align:middle;
}

.dashboard-container td font{
color:var(--text-dark) !important;
font-size:.95rem !important;
}

.dashboard-container tr:hover td{
background:#f3f6fa !important;
}

/* ===== BUTTON ===== */

.dashboard-container td a{
display:inline-block;
background:var(--secondary-blue);
color:white !important;
padding:8px 16px;
border-radius:8px;
font-size:.9rem;
font-weight:600;
transition:.25s;
}

.dashboard-container td a:hover{
background:var(--accent-red);
transform:translateY(-2px);
}

.dashboard-container td a font{
color:white !important;
}

/* STYLED TABLE & BADGES */
.table-container{width:100%;overflow-x:auto;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.06);background:white;margin-top:15px;}
.styled-table{width:100%;border-collapse:collapse;text-align:left;font-size:0.92rem;}
.styled-table thead tr{background:linear-gradient(135deg,#1E4E8C,#3B6EA5);color:white;font-weight:600;}
.styled-table th,.styled-table td{padding:13px 18px;border-bottom:1px solid #e5e7eb;}
.styled-table tbody tr:hover{background-color:#f8fafc;}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:0.78rem;font-weight:600;}
.badge-info{background:#e0f2fe;color:#0284c7;}
.btn-choose{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:#1E4E8C;color:white!important;border-radius:20px;font-size:0.85rem;font-weight:500;transition:0.2s ease;}
.btn-choose:hover{background:var(--accent-red);transform:translateY(-1px);}

/* ===== FOOTER ===== */

.main-footer{
background:var(--primary-blue);
color:white;
padding:1rem 5%;
display:flex;
justify-content:space-between;
align-items:center;
margin-top:auto;
}

.footer-links{
display:flex;
gap:25px;
}

.footer-link{
font-size:.9rem;
opacity:.8;
}

.footer-link:hover{
opacity:1;
text-decoration:underline;
}

.social-icons{
display:flex;
gap:20px;
}

.social-icon{
font-size:1.2rem;
opacity:.8;
}

.social-icon:hover{
opacity:1;
transform:translateY(-3px);
}

/* ===== RESPONSIVE ===== */

@media(max-width:900px){

.nav-menu{
justify-content:center;
}

.dashboard-container{
padding:25px;
}

}

@media(max-width:768px){

.main-header{
flex-direction:column;
gap:12px;
}

.main-footer{
flex-direction:column;
gap:15px;
text-align:center;
}

}

</style>

</head>

<body>

<header class="main-header">

<div class="logo-container">
<i class="fas fa-user-graduate logo-icon"></i>
<span>Student Portal</span>
</div>

<nav class="nav-menu">

<a href="{% url 'StudentMessaging' %}" class="nav-link">
<i class="fas fa-envelope"></i> Messaging
</a>

<a href="{% url 'ChooseFaculty' %}" class="nav-link active">
<i class="fas fa-user-check"></i> Choose Faculty
</a>

<a href="{% url 'Feedback' %}" class="nav-link">
<i class="fas fa-comment-dots"></i> Feedback
</a>

<a href="{% url 'StudentScreen' %}" class="nav-link">
<i class="fas fa-arrow-left"></i> Back
</a>

</nav>

</header>

<main class="main-content">

<div class="dashboard-container">

<h2 class="dashboard-title">Faculty Selection</h2>

<p class="dashboard-subtitle">
Review faculty ratings and choose your preferred instructor.
</p>

<div class="table-responsive">

{{ data|safe }}

</div>

</div>

</main>

<footer class="main-footer">

<div class="footer-links">
<a href="#" class="footer-link">Contact Support</a>
<a href="#" class="footer-link">Privacy Policy</a>
<a href="#" class="footer-link">Terms of Service</a>
</div>

<div class="social-icons">
<a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
<a href="#" class="social-icon"><i class="fab fa-twitter"></i></a>
<a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
<a href="#" class="social-icon"><i class="fab fa-linkedin-in"></i></a>
</div>

</footer>

</body>
</html>
